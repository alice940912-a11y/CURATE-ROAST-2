    function ScrollReveal({ children, className = '', delay = 0, direction = 'up' }) {
      const [isVisible, setIsVisible] = useState(false);
      const elementRef = useRef(null);

      useEffect(() => {
        const target = elementRef.current;
        if (!target) return;
        const observer = new IntersectionObserver(
          ([entry]) => { setIsVisible(entry.isIntersecting); },
          { threshold: 0.12, rootMargin: '0px 0px -40px 0px' }
        );
        observer.observe(target);
        return () => observer.disconnect();
      }, []);

      const getInitialTransform = () => {
        switch (direction) {
          case 'left': return '-translate-x-8';
          case 'right': return 'translate-x-8';
          case 'scale': return 'scale-95';
          case 'up':
          default: return 'translate-y-8';
        }
      };

      return (
        <div
          ref={elementRef}
          style={{ transitionDelay: `${isVisible ? delay : 0}ms` }}
          className={`transition-all duration-700 ease-out will-change-transform ${
            isVisible ? 'opacity-100 translate-y-0 translate-x-0 scale-100' : `opacity-0 ${getInitialTransform()}`
          } ${className}`}
        >
          {children}
        </div>
      );
    }

      const handlePrevMonth = (e) => {
        e.preventDefault();
        setViewDate(new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1));
      };
      const handleNextMonth = (e) => {
        e.preventDefault();
        setViewDate(new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1));
      };

      const handleSelectDate = (day) => {
        const selected = new Date(viewDate.getFullYear(), viewDate.getMonth(), day);
        const year = selected.getFullYear();
        const month = String(selected.getMonth() + 1).padStart(2, '0');
        const dateStr = String(selected.getDate()).padStart(2, '0');
        onChange(`${year}-${month}-${dateStr}`);
        setIsOpen(false);
      };

      const blanks = Array.from({ length: firstDay }, (_, i) => i);
      const days = Array.from({ length: daysInMonth }, (_, i) => i + 1);

      return (
        <div className="relative w-full">
          <div
            onClick={() => setIsOpen(true)}
            className="w-full px-4 py-3.5 rounded-xl bg-[#F9F9F6] border border-[#C5A880]/60 text-sm text-[#1B3829] flex items-center justify-between cursor-pointer hover:border-[#1B3829] transition-colors"
          >
            <span>{value || t('請選擇日期', 'Select a date')}</span>
            <Calendar className="w-4 h-4 text-[#C5A880]" />
          </div>

          {isOpen && (
            <>
              <div className="fixed inset-0 z-40" onClick={() => setIsOpen(false)} />
              <div className="absolute top-full left-0 mt-2 p-5 bg-white border-2 border-[#C5A880] rounded-2xl shadow-xl z-50 w-[300px]">
                <div className="flex justify-between items-center mb-4">
                  <button type="button" onClick={handlePrevMonth} className="p-1.5 hover:bg-[#F9F9F6] rounded-full text-[#1B3829] transition-colors"><ChevronLeft className="w-5 h-5" /></button>
                  <span className="text-sm font-semibold tracking-wider text-[#1B3829]">
                    {isEn ? `${monthNames[viewDate.getMonth()]} ${viewDate.getFullYear()}` : `${viewDate.getFullYear()}年 ${monthNames[viewDate.getMonth()]}`}
                  </span>
                  <button type="button" onClick={handleNextMonth} className="p-1.5 hover:bg-[#F9F9F6] rounded-full text-[#1B3829] transition-colors"><ChevronRight className="w-5 h-5" /></button>
                </div>
                <div className="grid grid-cols-7 gap-1 text-center mb-2">
                  {weekdays.map(day => (
                    <div key={day} className="text-xs font-semibold text-[#C5A880] py-1">{day}</div>
                  ))}
                </div>
                <div className="grid grid-cols-7 gap-1 text-center">
                  {blanks.map(b => <div key={`blank-${b}`} className="p-2" />)}
                  {days.map(day => {
                    const dateObj = new Date(viewDate.getFullYear(), viewDate.getMonth(), day);
                    const isMonday = dateObj.getDay() === 1;
                    const isPast = dateObj < today;
                    const isDisabled = isMonday || isPast;
                    
                    const dateString = `${dateObj.getFullYear()}-${String(dateObj.getMonth()+1).padStart(2,'0')}-${String(dateObj.getDate()).padStart(2,'0')}`;

                    return (

                        key={day}
                        type="button"
                        disabled={isDisabled}
                        onClick={(e) => { e.preventDefault(); handleSelectDate(day); }}
                        className={`p-2 text-sm rounded-lg transition-all ${

                            ? 'text-[#1B3829]/20 cursor-not-allowed bg-gray-50/50'
                            : isSelected
                              ? 'bg-[#1B3829] text-white font-bold shadow-md'
                              : 'text-[#1B3829] hover:bg-[#C5A880]/20 font-medium'
                        }`}
                        title={isMonday ? t('週一公休', 'Closed on Mondays') : ''}
                      >
                        {day}
                      </button>
                    );
                  })}
                </div>
              </div>
            </>
          )}
        </div>
      );

            <input type="text" placeholder={t('例如：希望安排靠窗夜景席、飲品需更換天然低因基底', 'e.g., Window seat preferred, swap drinks to decaf base')} value={bookingForm.notes} onChange={(e) => setBookingForm({ ...bookingForm, notes: e.target.value })} className="w-full px-4 py-3 rounded-xl bg-[#F9F9F6] border border-[#C5A880]/60 text-sm text-[#1B3829] focus:outline-none focus:border-[#1B3829]" />

    const LocationSection = ({ t }) => (
      <ScrollReveal delay={180} className="lg:col-span-5 flex flex-col justify-between space-y-6">
        <div className="p-6 sm:p-8 rounded-3xl bg-[#1B3829] border border-[#C5A880]/50 space-y-4">
          <div className="flex items-center gap-2.5 text-[#C5A880]">
            <ShieldCheck className="w-5 h-5" />
            <h3 className="text-base font-semibold tracking-wider">{t('賓客預約與入席須知', 'Reservation & Seating Policy')}</h3>
          </div>
          <ul className="space-y-3 text-xs sm:text-sm text-white/85 leading-relaxed">
            <li className="flex items-start gap-2.5">
              <span className="text-[#C5A880] font-bold">•</span>
              <span><strong className="text-white">{t('純線上預約制：', 'Online Booking Only: ')}</strong>{t('為維護美術館級觀展靜謐與現做盤飾工藝，全館不提供現場候位服務。', 'To maintain museum-grade tranquility and plated dessert craftsmanship, we do not accept walk-ins.')}</span>
            </li>
            <li className="flex items-start gap-2.5">
              <span className="text-[#C5A880] font-bold">•</span>
              <span><strong className="text-white">{t('逾時 10 分鐘取消規範：', '10-Minute Late Policy: ')}</strong>{t('席次與專屬車位為您保留 10 分鐘，', 'Your seat and parking space will be held for 10 minutes. ')}<strong className="text-[#C5A880]">{t('超過預約時間 10 分鐘未報到即視同取消預約', 'Reservations are automatically cancelled if you are more than 10 minutes late')}</strong>。</span>
            </li>
            <li className="flex items-start gap-2.5">
              <span className="text-[#C5A880] font-bold">•</span>
              <span><strong className="text-white">{t('專屬停車場與專車接送：', 'Exclusive Parking & Transfer: ')}</strong>{t('館內設有專屬停車場，預約成功即保留車位；亦提供台北市區單程（NT$1,200）或往返（NT$2,200）私人專車上下山服務。', 'A parking spot is reserved upon booking confirmation. Private transfer service from Taipei City (One-way NT$1,200 / Roundtrip NT$2,200) is also available.')}</span>
            </li>
          </ul>

        <div className="rounded-3xl overflow-hidden border-2 border-[#C5A880]/60 bg-white text-[#1B3829] flex-1 flex flex-col shadow-xl">

            <div className="flex items-center gap-2">
              <Compass className="w-4 h-4 text-[#1B3829]" />
              <span className="text-[10px] sm:text-xs font-semibold tracking-wider text-[#1B3829]">{t('台北市士林區仰德大道二段 138 巷 28 號', 'No. 28, Ln. 138, Sec. 2, Yangde Blvd., Shilin Dist., Taipei City')}</span>
            </div>
            <a href="https://maps.google.com/?q=台北市士林區仰德大道二段138巷28號" target="_blank" rel="noreferrer" className="text-xs font-semibold text-[#C5A880] hover:underline flex items-center gap-1 shrink-0">
              <span>{t('開啟導航', 'Open Map')}</span><ArrowUpRight className="w-3.5 h-3.5" />
            </a>
          </div>
          <div className="w-full h-64 lg:h-full min-h-[250px] bg-[#F9F9F6]">
            <iframe title="萃藝空間 CURATE & ROAST 陽明山位置地圖" src="https://maps.google.com/maps?width=100%25&height=600&hl=en&q=台北市士林區仰德大道二段138巷28號&t=&z=15&ie=UTF8&iwloc=B&output=embed" className="w-full h-full border-0" loading="lazy" />
          </div>

    const Footer = ({ t }) => (

        <ScrollReveal className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-10 pb-12 border-b border-[#C5A880]/40">

            <h3 className="text-xl font-semibold tracking-[0.2em] text-[#1B3829]">{t('萃藝空間', 'CURATE & ROAST')}</h3>
            <p className="text-xs font-semibold tracking-[0.28em] text-[#C5A880] uppercase">{t('CURATE & ROAST', 'YANGMINGSHAN GALLERY')}</p>
            <p className="text-xs text-[#1B3829]/70 leading-relaxed pt-2">{t('「時序空間工作室」長期跨界策展合作據點。集結當代藝術定期輪展、法式盤飾甜點、微批次單品咖啡與陽明山夜景視野的感官沙龍。', 'A collaborative physical venue by Chrono Space Studio. A sensory salon combining regular contemporary art rotations, French plated desserts, micro-batch specialty coffee, and panoramic night views of Yangmingshan.')}</p>
          </div>
          <div className="space-y-3 text-xs sm:text-sm">
            <h4 className="text-xs font-semibold tracking-[0.25em] text-[#C5A880] uppercase">{t('營業資訊 HOURS & LOCATION', 'HOURS & LOCATION')}</h4>
            <div className="space-y-2 text-[#1B3829]/85">
              <p className="flex items-start gap-2"><MapPin className="w-4 h-4 text-[#1B3829] shrink-0 mt-0.5" /><span>{t('台北市士林區仰德大道二段 138 巷 28 號（陽明山永公路秘境山腰帶）', 'No. 28, Ln. 138, Sec. 2, Yangde Blvd., Shilin Dist., Taipei City')}</span></p>
              <p className="flex items-start gap-2"><Clock className="w-4 h-4 text-[#1B3829] shrink-0 mt-0.5" /><span>{t('週二至週日 10:00 – 24:00', 'Tue – Sun 10:00 – 24:00')}<span className="block text-[#C5A880] font-medium text-xs mt-0.5">{t('每週一固定公休', 'Closed on Mondays')}</span></span></p>
            </div>
          </div>
          <div className="space-y-3 text-xs sm:text-sm">
            <h4 className="text-xs font-semibold tracking-[0.25em] text-[#C5A880] uppercase">{t('交通與停車 ACCESS & PARKING', 'ACCESS & PARKING')}</h4>
            <div className="space-y-2 text-[#1B3829]/85">
              <p className="flex items-start gap-2"><Car className="w-4 h-4 text-[#1B3829] shrink-0 mt-0.5" /><span>{t('位於陽明山秘境路段，建議自行開車前往。', 'Located in a secret Yangmingshan route; driving is recommended.')}</span></p>
            </div>
          </div>
          <div className="space-y-3 text-xs sm:text-sm">
            <h4 className="text-xs font-semibold tracking-[0.25em] text-[#C5A880] uppercase">{t('聯絡與策展洽詢 CONTACT', 'CONTACT & INQUIRIES')}</h4>
            <div className="space-y-2.5 text-[#1B3829]/85">
              <p className="flex items-center gap-2"><Phone className="w-4 h-4 text-[#1B3829] shrink-0" /><a href="tel:02-2861-9473" className="hover:text-[#C5A880] font-medium">02-2861-9473</a></p>
              <p className="flex items-center gap-2"><Mail className="w-4 h-4 text-[#1B3829] shrink-0" /><a href="mailto:concierge@curateandroast.tw" className="hover:text-[#C5A880] break-all">concierge@curateandroast.tw</a></p>
              <p className="flex items-center gap-2"><Instagram className="w-4 h-4 text-[#1B3829] shrink-0" /><a href="https://instagram.com" target="_blank" rel="noreferrer" className="hover:text-[#C5A880]">@curateandroast.taipei</a></p>
            </div>
          </div>
        </ScrollReveal>
        <div className="max-w-7xl mx-auto pt-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-[#1B3829]/60">
          <p>© 2026 {t('萃藝空間', 'CURATE & ROAST')}. All Rights Reserved. <span className="opacity-60 ml-1">| Demo images sourced from Unsplash.</span></p>
          <p className="tracking-widest font-medium text-[#1B3829]">CURATED IN PARTNERSHIP WITH CHRONO SPACE STUDIO</p>
        </div>
      </footer>
    );

    const BookingSuccessModal = ({ t, isEn, showBookingSuccessModal, setShowBookingSuccessModal, confirmedBookingSnapshot, getTransportDetails }) => {
      if (!showBookingSuccessModal || !confirmedBookingSnapshot) return null;

      return (
        <div className="fixed inset-0 z-50 bg-[#1B3829]/85 backdrop-blur-md flex items-center justify-center p-4" onClick={() => setShowBookingSuccessModal(false)}>
          <div className="max-w-xl w-full rounded-3xl bg-[#FFFFFF] border-2 border-[#C5A880] p-6 sm:p-9 text-[#1B3829] shadow-2xl space-y-6" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-start justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-11 h-11 rounded-full bg-[#1B3829] border border-[#C5A880] flex items-center justify-center text-white"><CheckCircle2 className="w-6 h-6" /></div>
                <div>
                  <span className="text-[11px] font-semibold tracking-[0.25em] text-[#C5A880] uppercase">RESERVATION CONFIRMED</span>
                  <h3 className="text-xl sm:text-2xl font-medium text-[#1B3829]">{t('線上預約已成功送出', 'Reservation Successfully Submitted')}</h3>
                </div>
              </div>
              <button onClick={() => setShowBookingSuccessModal(false)} className="p-2 rounded-full hover:bg-[#1B3829]/10 text-[#1B3829]/80"><X className="w-5 h-5" /></button>
            </div>
            <div className="p-5 rounded-2xl bg-[#F9F9F6] border-2 border-[#C5A880] text-sm sm:text-base text-[#1B3829] leading-relaxed font-medium shadow-inner">
              {t('「本店採線上預約制，不提供現場候位等服務，造成不便請見諒，另外，本店設有專屬停車場，預約成功後將為您保留專屬車位，屆時報到時提供姓名、電話即會為您帶位，謝謝。」', '"Our venue operates strictly on an online reservation basis; we do not accept walk-ins. We apologize for any inconvenience. A dedicated parking space will be reserved for you upon booking confirmation. Please provide your name and phone number upon arrival for valet seating. Thank you."')}
            </div>
            <div className="p-4 rounded-2xl bg-white border border-[#C5A880]/40 space-y-2 text-xs sm:text-sm">
              <div className="flex justify-between"><span className="text-[#1B3829]/70">{t('預約貴賓：', 'Guest Name: ')}</span><span className="font-medium text-[#1B3829]">{confirmedBookingSnapshot.name}（{confirmedBookingSnapshot.phone}）</span></div>
              <div className="flex justify-between"><span className="text-[#1B3829]/70">{t('預約時間：', 'Booking Time: ')}</span><span className="font-medium text-[#1B3829]">{confirmedBookingSnapshot.date} · {confirmedBookingSnapshot.time}（{confirmedBookingSnapshot.guests} {t('位', 'Pax')}）</span></div>
              <div className="flex justify-between"><span className="text-[#1B3829]/70">{t('體驗方案：', 'Experience Plan: ')}</span><span className="font-medium text-[#1B3829] text-right truncate max-w-[200px]">{isEn ? PLAN_OPTIONS.find(p => p.id === confirmedBookingSnapshot.plan)?.en : PLAN_OPTIONS.find(p => p.id === confirmedBookingSnapshot.plan)?.zh}</span></div>
              <div className="flex justify-between"><span className="text-[#1B3829]/70">{t('交通禮賓方式：', 'Transfer / Access: ')}</span><span className="font-medium text-[#1B3829] text-right">{getTransportDetails(confirmedBookingSnapshot.transport).label}</span></div>
              {confirmedBookingSnapshot.pickupAddress && <div className="flex justify-between"><span className="text-[#1B3829]/70">{t('專車接送地址：', 'Pick-up Address: ')}</span><span className="font-medium text-[#1B3829] text-right">{confirmedBookingSnapshot.pickupAddress}</span></div>}
              <p className="text-[11px] text-[#C5A880] pt-2 border-t border-[#C5A880]/25">* {t('溫馨提醒：超過預約時間 10 分鐘未報到即視同取消預約。', 'Reminder: Reservations are cancelled if you arrive more than 10 minutes late.')}</p>
            </div>
            <button onClick={() => setShowBookingSuccessModal(false)} className="w-full py-3.5 rounded-full bg-[#1B3829] text-[#FFFFFF] text-sm font-semibold tracking-[0.2em] hover:bg-[#1B3829]/90 border border-[#C5A880] transition-colors uppercase">{t('我已了解，完成預約確認', 'UNDERSTOOD & CONFIRMED')}</button>
          </div>
        </div>
      );
    };

    /* ==========================================
     * MAIN APP COMPONENT (Orchestrator)
     * ========================================== */

    function App() {
      const [language, setLanguage] = useState('zh-TW');
      const isEn = language.startsWith('en');
      const isUK = language === 'en-GB';
      const t = (zh, enUS, enGB = enUS) => isEn ? (isUK ? enGB : enUS) : zh;

      const scrollToSection = (id) => {
        const el = document.getElementById(id);
        if (el) { el.scrollIntoView({ behavior: 'smooth' }); }
      };

      const [activeMenuItem, setActiveMenuItem] = useState(null);
      const [activeExhibition, setActiveExhibition] = useState(null);

      const [bookingForm, setBookingForm] = useState({
        plan: 'plan1', date: '2026-11-20', time: '13:30', guests: '2',
        transport: 'self_drive', pickupAddress: '', name: '', phone: '', notes: ''
      });
      const [bookingError, setBookingError] = useState('');
      const [showBookingSuccessModal, setShowBookingSuccessModal] = useState(false);
      const [confirmedBookingSnapshot, setConfirmedBookingSnapshot] = useState(null);

      const handleSelectPlanFromModal = (planId) => {
        setBookingForm((prev) => ({ ...prev, plan: planId }));
        setActiveExhibition(null);
        scrollToSection('reservation');
      };

      const handleBookingSubmit = (e) => {
        e.preventDefault();
        setBookingError('');
        if (!bookingForm.name.trim() || !bookingForm.phone.trim()) {
          setBookingError(t('請填寫完整預約人姓名與聯絡電話，以便為您保留席次與專屬車位。', 'Please provide your full name and phone number to secure your reservation and parking space.'));
          return;
        }
        if ((bookingForm.transport === 'chauffeur_oneway' || bookingForm.transport === 'chauffeur_roundtrip') && !bookingForm.pickupAddress.trim()) {
          setBookingError(t('您選擇了私人專車接送服務，請填寫台北市區上車／下車地址以利安排禮賓車隊。', 'You selected private transfer. Please provide your pick-up/drop-off address in Taipei City.'));
          return;
        }

        if (bookingForm.time === '19:30') {
          setBookingError(t('您所預約時段已滿，請另選其他時段，感謝您的配合。', 'The selected time slot is fully booked. Please choose another time. Thank you for your cooperation.'));
          return;
        }

        setConfirmedBookingSnapshot({ ...bookingForm });
        setShowBookingSuccessModal(true);
      };

      const getTransportDetails = (type) => {
        switch (type) {
          case 'chauffeur_oneway': return { label: t('預約私人專車接送（單程上山 或 下山）', 'Private Transfer (One-way)', 'Private Transfer (One-way)'), fee: t('NT$ 1,200 / 趟', 'NT$ 1,200 / Trip', 'NT$ 1,200 / Trip'), desc: t('豪華禮賓專車台北市區點對點接送（每車最多 3 位貴賓）', 'Luxury point-to-point transfer from Taipei City (Max 3 guests per car)') };
          case 'chauffeur_roundtrip': return { label: t('預約私人專車接送（雙程往返：上山 ＋ 下山）', 'Private Transfer (Roundtrip)'), fee: t('NT$ 2,200 / 往返', 'NT$ 2,200 / Roundtrip'), desc: t('含去程接駁與夜間離場專屬候車禮遇（每車最多 3 位貴賓）', 'Includes arrival transfer and exclusive departure waiting service (Max 3 guests)') };
          default: return { label: t('自行駕車前往（保留館內專屬停車位）', 'Self-Driving (Reserved Parking Included)'), fee: t('免費禮遇（預約自動保留車位）', 'Complimentary (Parking auto-reserved)'), desc: t('抵達陽明山仰德大道二段 138 巷 28 號時，報姓名與電話即有專人引導泊車', 'Valet service available upon arrival at our Yangmingshan venue') };
        }
      };

      return (
        <div className="min-h-screen bg-[#FFFFFF] text-[#1B3829] font-sans antialiased selection:bg-[#C5A880] selection:text-[#FFFFFF]">
          <Navbar language={language} setLanguage={setLanguage} t={t} isEn={isEn} scrollToSection={scrollToSection} />
          <HeroSection t={t} scrollToSection={scrollToSection} />
          <AboutSection t={t} isUK={isUK} />
          <MenuSection t={t} isEn={isEn} scrollToSection={scrollToSection} setBookingForm={setBookingForm} activeMenuItem={activeMenuItem} setActiveMenuItem={setActiveMenuItem} />
          <Gallery t={t} isEn={isEn} scrollToSection={scrollToSection} activeExhibition={activeExhibition} setActiveExhibition={setActiveExhibition} handleSelectPlanFromModal={handleSelectPlanFromModal} />
          
          <section id="reservation" className="py-20 sm:py-28 px-4 sm:px-6 lg:px-10 bg-[#1B3829] text-white border-b border-[#C5A880]/40 overflow-hidden">
            <div className="max-w-7xl mx-auto">
              <ScrollReveal className="pb-10 border-b border-[#C5A880]/35">
                <span className="text-xs font-semibold tracking-[0.3em] text-[#C5A880] uppercase">04 / ONLINE RESERVATION &amp; CHAUFFEUR SERVICE</span>
                <h2 className="text-3xl sm:text-4xl font-light tracking-wider text-white mt-3">{t('線上預約席次・專屬保留車位與私人專車接送', 'Online Reservation · VIP Parking & Private Chauffeur Transfer')}</h2>
                <p className="text-sm text-white/80 mt-2">{t('全館採純線上預約制，不提供現場候位。超過預約時間 10 分鐘未報到，系統將自動視同取消預約。', 'Online booking only; no walk-ins accepted. Reservations are automatically cancelled if you are more than 10 minutes late.')}</p>
              </ScrollReveal>
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-10 pt-12">
                <ReservationForm t={t} isEn={isEn} bookingForm={bookingForm} setBookingForm={setBookingForm} handleBookingSubmit={handleBookingSubmit} bookingError={bookingError} />
                <LocationSection t={t} />
              </div>
            </div>
          </section>

          <Footer t={t} />
          <BookingSuccessModal t={t} isEn={isEn} showBookingSuccessModal={showBookingSuccessModal} setShowBookingSuccessModal={setShowBookingSuccessModal} confirmedBookingSnapshot={confirmedBookingSnapshot} getTransportDetails={getTransportDetails} />
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
